<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Grid Controller ✋（手のみ・env-4）</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="before-start">
    <!-- 背景ビデオ（カメラ映像） -->
    <video id="webcam" autoplay playsinline muted></video>
    <div id="video-overlay"></div>
    
    <!-- 掴んだオブジェクトを手に追従表示するレイヤー -->
    <div id="object-drag-layer"></div>

    <!-- 9分割グリッド -->
    <div id="grid-container">
        <div class="grid-cell" data-index="0"></div>
        <div class="grid-cell" data-index="1"></div>
        <div class="grid-cell" data-index="2"></div>
        <div class="grid-cell" data-index="3"></div>
        <div class="grid-cell" data-index="4"></div>
        <div class="grid-cell" data-index="5"></div>
        <div class="grid-cell" data-index="6"><div class="grid-cell-bg" style="background-image: url('image/box_1.png')"></div></div>
        <div class="grid-cell" data-index="7"><div class="grid-cell-bg" style="background-image: url('image/box_1.png')"></div></div>
        <div class="grid-cell" data-index="8"><div class="grid-cell-bg" style="background-image: url('image/box_1.png')"></div></div>
    </div>
    
    <!-- 2D手描画キャンバス -->
    <canvas id="hand-canvas"></canvas>

<!-- サイドバー（ゲーム中のみ表示） -->
    <div id="sidebar">
        <!-- 実験手順 -->
        <div class="sidebar-steps-section">
            <p class="sidebar-steps-title">実験手順</p>
            <ol class="sidebar-steps">
                <li><span>箱Bのフタをとる</span></li>
                <li><span>ピペットで吸う</span></li>
                <li><span>箱Bのフタを閉める</span></li>
                <li><span>箱Aのフタをとる</span></li>
                <li><span>ピペットで排出する</span></li>
                <li><span>箱Aのフタを閉める</span></li>
            </ol>
        </div>
        <div id="contamination-panel" class="contamination-panel">
            <span class="contamination-label">コンタミネーション</span>
            <span id="contamination-score" class="contamination-score contamination-score--safe">0</span>
            <div id="contamination-gauge-wrap" class="contamination-gauge-wrap">
                <div id="contamination-gauge-bar" class="contamination-gauge-bar"></div>
            </div>
        </div>
        <!-- トグル群 -->
        <div class="toggle-container">
            <div class="toggle-row">
                <span class="toggle-label">ランドマーク（手）</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="landmark-toggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="toggle-row">
                <span class="toggle-label">マス番号</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="grid-numbers-toggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        <button id="back-to-start-btn" class="back-to-start-btn hidden" type="button">スタートへ戻る</button>
    </div>

    <!-- マス番号オーバーレイ（最前面・中央固定） -->
    <div id="grid-numbers-overlay" aria-hidden="true">
        <span class="grid-number">0</span>
        <span class="grid-number">1</span>
        <span class="grid-number">2</span>
        <span class="grid-number">3</span>
        <span class="grid-number">4</span>
        <span class="grid-number">5</span>
        <span class="grid-number">6</span>
        <span class="grid-number">7</span>
        <span class="grid-number">8</span>
    </div>

    <!-- UI -->
    <div id="ui-overlay">
        <!-- スタートボタン -->
        <div id="start-container" class="start-container">
            <button id="start-btn" class="start-btn">
                <span class="btn-text">Start</span>
            </button>
        </div>
        
    </div>
    
    <!-- ローディング画面 -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading...</p>
        </div>
    </div>

    <!-- アプリケーション -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
